name: Build Android APK (UNAMDD Mining)
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Add Android platform
        run: cordova platform add android@13 --no-telemetry

      - name: Build APK
        run: cordova build android --no-telemetry

      - name: Find and rename APK
        id: apk
        run: |
          APK=$(find platforms/android -name '*-debug.apk' | head -n1)
          echo "APK trouvé : $APK"
          cp "$APK" UNAMDD-Mining-debug.apk
          echo "path=UNAMDD-Mining-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UNAMDD-Mining-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
