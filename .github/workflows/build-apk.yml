name: Build Android APK (UNAMDD Mining)
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: android-actions/setup-android@v3
      - run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true
      - run: npm install -g cordova@12
      - run: cordova platform add android@12 --no-telemetry
      - run: cordova build android --no-telemetry
      - id: apk
        run: |
          APK=$(find platforms/android -name '*-debug.apk' | head -n1)
          cp "$APK" UNAMDD-Mining-debug.apk
          echo "path=UNAMDD-Mining-debug.apk" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: UNAMDD-Mining-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
